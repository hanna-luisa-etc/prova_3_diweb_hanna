<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PetCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🐾 PetCare</a>
        <nav>
            <ul>
                <li><a href="index.html">Ofertas</a></li>
                <li><a href="produto.html">Serviços</a></li>
                <li><a href="new.html">Cadastro</a></li>
                <li><a href="login.html">👤 Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>👤 Novo Usuário</h2>
            <form onsubmit="fazerCadastro(event)" style="display: flex; flex-direction: column; gap: 1rem;">
                
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Informe o seu e-mail" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Informe a sua senha" required>
                </div>

                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Informe o seu nome" required>
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo de Usuário</label>
                    <select id="tipo" style="padding: 0.7rem; border: 1px solid #ccc; border-radius: 6px;">
                        <option value="visitante">Visitante</option>
                        <option value="tutor">Tutor</option>
                        <option value="parceiro">Clínica Parceira</option>
                    </select>
                </div>

                <!-- Qual é o seu pet (Múltipla escolha + Outro com input) -->
                <div class="form-group">
                    <label>Qual é o seu pet?</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="pet" value="cachorro"> Cachorro</label>
                        <label><input type="checkbox" name="pet" value="gato"> Gato</label>
                        <label><input type="checkbox" name="pet" value="outro" id="checkOutroPet" onclick="toggleOutroPet()"> Outro</label>
                    </div>
                    <div id="campoOutroPet" style="display: none; margin-top: 0.5rem;">
                        <input type="text" id="nomeOutroPet" placeholder="Qual o nome do animal?">
                    </div>
                </div>

                <!-- Qual a raça do seu animal (Campo de texto igual ao outro) -->
                <div class="form-group">
                    <label for="raca">Qual a raça do seu animal?</label>
                    <input type="text" id="raca" placeholder="Informe a raça do animal">
                </div>

                <!-- Foto do Tutor (Obrigatória) -->
                <div class="form-group">
                    <label for="fotoTutor">Foto do Tutor</label>
                    <input type="file" id="fotoTutor" accept="image/*" required>
                </div>

                <!-- Foto do Animal (Obrigatória) -->
                <div class="form-group">
                    <label for="fotoAnimal">Foto do Animal</label>
                    <input type="file" id="fotoAnimal" accept="image/*" required>
                </div>

                <button type="submit" class="btn">👤 Criar conta</button>
            </form>
        </section>
    </main>

    <!-- Toast Automático de Sucesso no Cadastro (Sem botão OK) -->
    <div id="toast-cadastro" class="toast-feedback">
        Cadastro realizado com sucesso! Bem-vindo(a) à PetCare.
    </div>

    <footer>
        <div class="footer-content">
            <div style="font-weight: bold; font-size: 0.95rem;">🐾 PetCare</div>
            <p>A PetCare é uma clínica e pet shop dedicada à saúde, bem-estar e alegria do seu animal de estimação.</p>
            <div class="social-links">
                <a href="#" aria-label="Facebook" title="Facebook">🌐</a>
                <a href="#" aria-label="Instagram" title="Instagram">📸</a>
                <a href="#" aria-label="Twitter" title="Twitter">🐦</a>
            </div>
        </div>
        <p>&copy; 2026 PetCare. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Função para mostrar/esconder o campo de texto do pet "Outro"
        function toggleOutroPet() {
            const checkOutro = document.getElementById('checkOutroPet');
            const campoOutro = document.getElementById('campoOutroPet');
            if (checkOutro.checked) {
                campoOutro.style.display = "block";
            } else {
                campoOutro.style.display = "none";
            }
        }

        function fazerCadastro(event) {
            event.preventDefault();
            
            const toast = document.getElementById('toast-cadastro');
            toast.style.display = "block";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        }
    </script>
</body>
</html>
